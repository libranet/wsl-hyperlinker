# GitHub Actions workflow for wsl-hyperlinker: lint the workflows for security issues with zizmor.
# Reference: https://docs.zizmor.sh/
# Syntax: YAML (https://yaml.org)
#
# Results are uploaded as SARIF and appear under Security > Code scanning.
#
# GitHub Actions security references:
#   - https://securitylab.github.com/resources/github-actions-preventing-pwn-requests
#   - https://securitylab.github.com/resources/github-actions-untrusted-input
#   - https://securitylab.github.com/resources/github-actions-building-blocks
#   - https://securitylab.github.com/resources/github-actions-new-patterns-and-mitigations
#
# Used actions, pinned to a full commit SHA with the release tag in a comment:
#   - actions/checkout: https://github.com/actions/checkout/tags
#   - zizmorcore/zizmor-action: https://github.com/zizmorcore/zizmor-action/tags

name: Zizmor

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

permissions: {}  # no token permissions by default; the job asks for what it needs

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true  # a new push cancels the run for the previous one

jobs:
  zizmor:
    name: Run zizmor
    runs-on: ubuntu-26.04  # pinned: ubuntu-latest moves between releases
    permissions:
      security-events: write  # upload the SARIF results to code scanning
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482  # v0.6.4
        with:
          persona: pedantic  # strictest audits, including style and hardening findings
          version: "1.30.1"  # pinned: same version as local runs
