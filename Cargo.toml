# Cargo configuration for wsl-hyperlinker (the package manifest).
# Reference: https://doc.rust-lang.org/cargo/reference/manifest.html
# Syntax: TOML (https://toml.io)

[package]
name = "wsl-hyperlinker"
version = "0.1.0"
categories = ["command-line-utilities"]
description = "Rewrite terminal file hyperlinks (OSC 8) so Ctrl+click in Windows Terminal opens files from WSL"
documentation = "https://wsl-hyperlinker.readthedocs.io/"
edition = "2024"
include = ["/LICENSE-*", "/src/", "/tests/"]  # what ships to crates.io; Cargo.toml and Cargo.lock are always added
keywords = ["hyperlink", "osc8", "terminal", "windows-terminal", "wsl"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/libranet/wsl-hyperlinker"
rust-version = "1.87"  # oldest supported compiler: OsStr::display, str::from_utf8

[dependencies]
libc = "0.2"

# Lint levels: "allow", "warn" or "deny". `just lint` turns every warning into an error.
# Reference: https://doc.rust-lang.org/cargo/reference/manifest.html#the-lints-section
[lints.clippy]
pedantic = { level = "warn", priority = -1 }  # a group: -1 lets single lints override it
undocumented_unsafe_blocks = "warn"  # every `unsafe` needs a `// SAFETY:` comment

[lints.rust]
missing_docs = "warn"  # public items need a doc comment

[profile.release]
codegen-units = 1  # one unit: slower build, better optimisation
lto = true
opt-level = 3  # full optimisation
panic = "abort"
strip = true
